name: build-android-apk

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

      - name: Build debug APK (可直接安装)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ../gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Build release APK
        working-directory: android
        run: ../gradle-8.5/bin/gradle assembleRelease --no-daemon

      - name: List outputs
        run: find android/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: Pigeon-android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
